<!DOCTYPE html>
<html lang="jp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;750&display=swap" rel="stylesheet">
    <title>Clef Convert Shift</title>
    <link rel="stylesheet" href="style.css">
</head>
<!--ライブラリ-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js"></script>

<body>
    <div class="container">
        <header class="header">
            <h1 class="header-title"><a href="#home"> CLC Shift</a></h1>
            <!--<img src="images/app.svg" class="title-icon">-->
            <nav class="header-nav">
                <ul class="header-nav">
                    <select id="sourceClef">
                        <option value="" selected disabled>Before</option>
                        <option value="treble">𝄞 Treble</option>
                        <option value="alto">𝄡 Alto</option>
                        <option value="bass">𝄢 Bass</option>
                    </select>

                    <span class="clef-arrow">→</span>

                    <select id="targetClef">
                        <option value="" selected disabled>After</option>
                        <option value="treble">𝄞 Treble</option>
                        <option value="alto">𝄡 Alto</option>
                        <option value="bass">𝄢 Bass</option>
                    </select>

                    <!-- <li class="nav-list"><a href="#about">About</a></li> 
                    <li class="nav-list"><a href="#service">Service</a></li>
                    <li class="nav-list"><a href="#contents">Contents</a></li> -->
                    <input type="file" id="fileInput" accept=".mxl" hidden>
                    <label for="fileInput" class="file-btn">
                        <img src="images/open.svg" class="btn-icon">
                        File Input
                    </label>


                    <label id="fileOutput" class="file-btn output-btn">
                        <img src="images/download.svg" class="btn-icon">
                        Download
                    </label>
                </ul>
            </nav>
        </header>
        <div>
            <h2></h2>
                <div id="beforeScore"></div>

            <h2></h2>
                <div id="afterScore"></div>
            <script src="script.js"></script>
            <footer class="footer">
                <p>© 2026 CLC | Clef Convert Shift</p>
            </footer>
</body>

</html>
